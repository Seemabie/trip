<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanksgrilling at High Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE playful trip game, polished like a shipped app
   IDEA a road trip played chapter by chapter, like a travel pass you unlock stop by stop
   PICTURE every chapter is one live illustrated scene you tap: map, plate, mountain, fog, camp, cliff road, three states
   COLOUR deep spruce world, fog paper cards, ember orange for anything to tap, river blue for rain, green for done
   TYPE Overpass 900 titles and times (highway sign lettering) + Overpass text
   LAYOUT one screen app: header with chapter and progress bar, task chips, stage, big Next button that stays locked until the tasks are done */
:root{color-scheme:dark;--bg:#12342a;--deep:#0c261e;--panel:#0f2c23;--edge:#2c5a4b;--ink:#eef5ef;--mute:#a9c4b8;--ember:#ff6a3d;--eink:#2a0f05;--river:#7fb7c9;--paper:#f5f7f2;--pink:#12271f;--pmute:#4f6158;--ok:#2f8f67}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#1d4a3c 0%,#12342a 55%,#0b2119 100%);color:var(--ink);font:16px/1.5 Overpass,system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-weight:900;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;max-width:1100px;margin:0 auto;padding:0 max(16px,3vw)}
.hd{display:flex;align-items:center;gap:12px;padding:14px 0 8px}
.hd .tt{flex:1}
#kick{font-size:13px;color:var(--mute)}
#ttl{display:block;font-size:20px;font-weight:900;line-height:1.15}
.brand{font-weight:900;color:var(--ember)}
.ib0{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:var(--panel);font-size:24px;line-height:1;flex:none}
.ib0:disabled{opacity:.35;cursor:default}
.bar{display:grid;gap:4px}
.bar button{height:18px;border:0;background:none;padding:0;position:relative}
.bar button::before{content:"";position:absolute;left:0;right:0;top:6px;height:6px;border-radius:9px;background:#2a5446}
.bar button.dn::before{background:var(--ember)}
.bar button.cur::before{background:#fff}
.bar button:disabled{cursor:default}
.tasks{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 2px}
.tasks .tl{font-size:13px;color:var(--mute);margin-right:2px}
.task{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);font-size:14px;font-weight:800}
.task i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ember);display:grid;place-items:center;flex:none}
.task.ok{color:var(--mute)}
.task.ok i{background:var(--ok);border-color:var(--ok)}
.task em{font-style:normal;color:var(--ember);font-variant-numeric:tabular-nums}
.stage{overflow-y:auto;overflow-x:hidden;padding:12px 2px 18px;position:relative}
.ft{padding:8px 0 max(14px,env(safe-area-inset-bottom))}
.next{width:100%;min-height:58px;border-radius:16px;border:0;background:#24493d;color:var(--mute);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.next.ready{background:var(--ember);color:var(--eink);animation:rdy 1.8s ease-in-out infinite}
.next.shake{animation:shk .4s}
@keyframes rdy{50%{box-shadow:0 0 0 7px rgba(255,106,61,.25)}}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.todo{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,106,61,.7)}60%{box-shadow:0 0 0 9px rgba(255,106,61,0)}}
.nudge .todo{animation-duration:.55s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pr 1.6s ease-out infinite;pointer-events:none}
@keyframes pr{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
.nudge .pulse{animation-duration:.6s}
.scr{opacity:0;transform:translateX(28px);transition:opacity .35s,transform .35s}
.scr.bl{transform:translateX(-28px)}
.scr.on{opacity:1;transform:none}
.lead h1{font-size:clamp(32px,5vw,48px)}
.lead h2{font-size:clamp(26px,4vw,36px)}
.lead p{color:var(--mute);margin-top:8px;max-width:62ch;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--ember);color:var(--eink);font-weight:900;border:0;text-decoration:none}
.btn.gh{background:transparent;color:var(--ink);border:1.5px solid var(--edge)}
.lnk{display:inline-block;margin-top:12px;color:var(--ember);font-weight:800}
.note{color:var(--mute);margin-top:12px;font-size:15px}
.pp{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:16px}
.pp h3{font-size:20px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;background:var(--paper);color:var(--pink);padding:12px 18px;border-radius:14px;font-weight:800;width:max-content;max-width:min(92vw,480px);text-align:center;transition:.25s;pointer-events:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.sbox{position:relative;border-radius:20px;overflow:hidden;background:#cfe0da;margin-top:14px}
.sbox>svg{display:block;width:100%;height:auto}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 160px;margin-top:20px;background:var(--paper);color:var(--pink);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.3);transition:transform .35s}
.ticket.punched{transform:rotate(-1.5deg)}
.tk-main{padding:22px}
.tk-k{font-size:14px;font-weight:800;color:#c2410c}
.tk-t{display:block;font-size:clamp(22px,3vw,30px);font-weight:900;line-height:1.1;margin-top:4px}
.tk-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.tk-g span{display:block;font-size:13px;color:var(--pmute)}
.tk-g b{font-size:17px;white-space:nowrap}
.tk-by{display:block;margin-top:16px;font-size:13px;color:var(--pmute)}
.tk-stub{border:0;border-left:3px dashed #c9d3cb;background:#ffe6dc;color:var(--pink);display:grid;place-items:center;align-content:center;gap:10px;padding:16px;font-weight:900;font-size:16px}
.tk-stub.todo{animation:none}
.tk-stub.todo .hole{animation:hp 1.2s ease-in-out infinite}
@keyframes hp{50%{transform:scale(1.18)}}
.hole{width:38px;height:38px;border-radius:50%;border:3px dashed #c2410c}
.punched .tk-stub{background:var(--ember)}
.punched .hole{background:#12342a;border:0;box-shadow:inset 0 3px 5px rgba(0,0,0,.5)}
.cdw{margin-top:22px}
.cdw>span{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
.count{display:flex;gap:8px;flex-wrap:wrap}
.count div{background:var(--deep);border:1px solid var(--edge);border-radius:14px;padding:9px 10px 6px;min-width:66px;text-align:center}
.count b{display:block;font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--mute)}
.count .live{text-align:left;padding:9px 16px 6px}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row2 input{flex:1 1 240px;min-height:48px;border-radius:12px;border:1.5px solid var(--edge);background:var(--deep);padding:0 14px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-top:16px}
.fc{position:relative;height:158px;border:0;background:none;padding:0;perspective:900px;border-radius:18px}
.fc .in{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}
.fc.fl .in{transform:rotateY(180deg)}
.fc .f,.fc .bk{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;align-content:center;justify-items:center;gap:4px;padding:14px;text-align:center}
.fc .f{background:var(--panel);border:1.5px solid var(--edge)}
.fc .f b{font-size:46px;font-weight:900;color:var(--ember);line-height:1}
.fc .f span{font-weight:800}
.fc .bk{background:var(--paper);color:var(--pink);transform:rotateY(180deg)}
.fc .bk em{font-style:normal;font-weight:900;color:#c2410c;font-size:19px;line-height:1.1}
.fc .bk small{font-size:13px;color:var(--pmute);line-height:1.3}
.fig{position:relative;height:clamp(220px,40vh,420px);border-radius:20px;overflow:hidden;background:#cfe0da;--sky1:#9cb7ae;--sky2:#e3ece6}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rainy .fig{--sky1:#6e8580;--sky2:#aebdb7}
svg text{font-family:Overpass,system-ui,sans-serif;font-weight:800}
.lab{font-size:14px;fill:#10261f;paint-order:stroke;stroke:#eef3ee;stroke-width:4px;stroke-linejoin:round}
.narrow .pin:not(.sel) .lab{display:none}
.pin{cursor:pointer;outline:none}
.pin .pi{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.pin .b{fill:#fff;stroke:#163b30;stroke-width:3}
.pin .n{fill:#163b30;font-size:14px;font-weight:900}
.pin.done .b{fill:#2f8f67;stroke:#fff}
.pin.done .n{fill:#fff}
.pin.sel .b{fill:var(--ember);stroke:#fff}
.pin.sel .n{fill:var(--eink)}
.pin.sel .pi,.pin:focus-visible .pi{transform:scale(1.28)}
.info{margin-top:12px}
.info .ct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.no{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ember);color:var(--eink);font-weight:900;flex:none}
.tm{font-size:28px;font-weight:900;line-height:1;white-space:nowrap}
.tm small{font-size:14px;margin-left:3px}
.info h3{font-size:24px;margin-top:10px}
.info .pl{color:var(--mute)}
.info p.bd{margin-top:8px}
.roads{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--mute)}
.sh{width:34px;height:34px;flex:none}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.mi{min-height:66px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--edge);background:var(--panel)}
.mi b{display:block;font-size:16px}
.mi span{font-size:13px;color:var(--mute)}
.mi[aria-pressed=true]{background:var(--paper);color:var(--pink);border-color:var(--paper)}
.mi[aria-pressed=true] span{color:var(--pmute)}
.plate svg{display:block;width:min(100%,380px);height:auto;margin:0 auto;filter:drop-shadow(0 16px 24px rgba(0,0,0,.3))}
.shrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.shb{min-height:88px;border-radius:16px;border:1.5px solid var(--edge);background:var(--panel);display:grid;justify-items:center;align-content:center;gap:4px;padding:10px}
.shb svg{width:42px;height:42px}
.shb span{font-size:13px;color:var(--mute);font-weight:700}
.shb.ok{border-color:var(--ok);background:#173f31}
.shb.lock{opacity:.55}
.shb.shake{animation:shk .4s}
.meter{height:10px;border-radius:99px;background:var(--edge);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ember);border-radius:99px;transition:width .5s}
.mt{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 6px;color:var(--mute)}
.big{margin-top:14px;font-size:clamp(20px,3vw,26px);font-weight:900;color:var(--ember)}
.puff{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .6s,transform .8s;animation:bob 3.2s ease-in-out infinite}
.puff.gone{opacity:0;pointer-events:none;animation:none}
.puff.gone.l{transform:translateX(-140px) scale(.7)}
.puff.gone.r{transform:translateX(140px) scale(.7)}
@keyframes bob{50%{transform:translateY(-6px)}}
.fc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.day{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:12px;text-align:center}
.day.hl{border:2px solid var(--ember)}
.day svg{width:56px;height:56px}
.day b{display:block;font-size:22px;font-weight:900;white-space:nowrap}
.day span{display:block;color:var(--mute);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.choice{padding:16px;border-radius:18px;border:1.5px solid var(--edge);background:var(--panel);text-align:left;min-height:116px}
.choice b{display:block;font-size:19px;line-height:1.2}
.choice span{display:block;color:var(--mute);font-size:15px;margin-top:6px}
.choice[aria-pressed=true]{background:var(--paper);color:var(--pink);border-color:var(--paper)}
.choice[aria-pressed=true] span{color:var(--pmute)}
.items{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.it0{min-height:48px;padding:0 16px;border-radius:99px;border:1.5px solid var(--edge);background:var(--panel);font-weight:800}
.it0[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.spots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.spots p{width:100%;color:var(--mute);font-size:15px}
.lbl{font-weight:800;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--edge);background:var(--panel);font-weight:800;font-size:15px}
.chip[aria-pressed=true]{background:var(--paper);border-color:var(--paper);color:var(--pink)}
.ringw{position:relative;width:min(220px,60vw);aspect-ratio:1;margin:0 auto}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:#24493d}
.ring .pg{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:clamp(36px,8vw,50px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.rc span{font-size:14px;color:var(--mute);margin-top:4px}
.gb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ember);color:var(--eink);font-weight:900;font-size:18px;text-align:center}
.steps{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.steps li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--panel);font-size:15px}
.steps li.on{background:var(--paper);color:var(--pink);font-weight:800}
.steps li.ok{color:var(--mute);text-decoration:line-through}
.steps b{font-variant-numeric:tabular-nums}
.gact{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hint{font-size:14px;color:var(--mute);margin-top:10px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.camrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:14px}
.pol{background:#fff;color:#111;padding:10px 10px 12px;border-radius:6px;transform:rotate(-3deg);width:min(240px,70%);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.pol svg{display:block;width:100%;height:auto}
.pol p{font-weight:900;margin-top:8px;text-align:center;font-size:15px}
.veil{transition:opacity .9s}
.up .veil{opacity:0}
.reg{cursor:pointer;stroke:#fff;stroke-width:3;transition:fill .3s}
.reg.todo{animation:rf 1.6s ease-in-out infinite}
@keyframes rf{50%{fill:#ffd9cb}}
.reg.v{fill:#ffb79f}
.walker{transition:transform .6s}
.bags{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.bag{min-height:124px;border-radius:18px;border:1.5px solid var(--edge);background:var(--panel);display:grid;justify-items:center;align-content:center;gap:4px;padding:10px;color:var(--ink)}
.bag svg{width:62px;height:54px;color:var(--ember)}
.bag b{font-size:15px}
.bag em{font-style:normal;font-size:13px;color:var(--mute)}
.bag[aria-expanded=true]{background:var(--paper);color:var(--pink);border-color:var(--paper)}
.bag[aria-expanded=true] em{color:var(--pmute)}
.plist{margin-top:12px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:6px 16px}
.it{display:flex;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid var(--edge);cursor:pointer}
.it:last-child{border-bottom:0}
.it input{width:22px;height:22px;accent-color:#2f8f67;flex:none}
.it.got span{text-decoration:line-through;color:var(--mute)}
.qcard{background:var(--paper);color:var(--pink);border-radius:22px;padding:22px;max-width:680px;margin-top:14px}
.qcard h3{font-size:clamp(22px,3vw,28px)}
.qdots{display:flex;gap:6px;margin-bottom:14px}
.qdots i{width:30px;height:6px;border-radius:9px;background:#cdd7cf}
.qdots i.d{background:var(--ok)}
.qdots i.c{background:var(--ember)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{min-height:56px;text-align:left;padding:0 16px;border-radius:14px;border:2px solid #d3dcd4;background:#fff;color:var(--pink);font-weight:800;font-size:17px}
.opt.todo{animation:glow 1.6s ease-in-out infinite}
.opt.right{background:#d8f1e4;border-color:#2f8f67}
.opt.wrong{background:#ffe1d6;border-color:#c2410c}
.expl{margin-top:12px;color:#33463d}
.qcard .btn{margin-top:14px}
.endg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--edge)}
.mini li:last-child{border-bottom:0}
.mini b{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini small{font-size:12px;margin-left:2px}
.picks{display:grid;gap:8px;margin:0 0 14px}
.picks div{display:grid;grid-template-columns:7em minmax(0,1fr);gap:10px}
.picks dt{color:var(--mute);font-size:14px}
.picks dd{margin:0;font-weight:800}
.legs{display:grid;gap:8px}
.leg{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px;padding:8px 14px;border-radius:12px;background:var(--deep);text-decoration:none;border:1px solid var(--edge);color:var(--ink)}
.leg b{display:block}
.leg span{font-size:13px;color:var(--mute)}
.leg em{font-style:normal;color:var(--ember);font-weight:900;flex:none}
.cf{position:fixed;top:-16px;width:9px;height:15px;border-radius:2px;z-index:8;pointer-events:none;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.vinyl svg{display:block;width:min(100%,320px);height:auto;margin:0 auto;filter:drop-shadow(0 16px 24px rgba(0,0,0,.35))}
.vinyl.spin svg{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#plj{margin-top:14px}
@media(max-width:760px){.split,.two,.endg{grid-template-columns:minmax(0,1fr)}.choices{grid-template-columns:minmax(0,1fr)}.plate svg{width:min(70%,260px)}.vinyl svg{width:min(55%,220px)}.split{gap:14px}}
@media(max-width:600px){.ticket{grid-template-columns:minmax(0,1fr)}.tk-stub{border-left:0;border-top:3px dashed #c9d3cb;grid-auto-flow:column;min-height:76px}.tk-g{grid-template-columns:repeat(2,minmax(0,1fr))}.bags{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{display:none}.count b{font-size:24px}.count div{min-width:58px}.fc3 .day svg{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <header class="hd"><button class="ib0" id="back" aria-label="Previous chapter">‹</button><div class="tt"><span id="kick"></span><b id="ttl"></b></div><span class="brand">Thanksgrilling</span></header>
 <nav class="bar" id="bar" aria-label="Chapters"></nav>
 <div class="tasks" id="tasks" aria-live="polite"></div>
 <main class="stage" id="stage"></main>
 <footer class="ft"><button class="next" id="next"></button></footer>

const spline=p=>{let d=`M${p[0][0]} ${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`}return d};

  const P=S.map(s=>[s.x*W,s.y*H]),m=P[3],oh=Math.min(86,H*.2);

 $('#bar').innerHTML=SC.map((s,i)=>`<button class="${i<st.max&&i!==st.at?'dn':''}${i===st.at?' cur':''}" data-g="${i}" aria-label="Chapter ${i+1}, ${s.t}"${i>st.max?' disabled':''}></button>`).join('')}
function go(i,d){i=Math.max(0,Math.min(SC.length-1,i));cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];st.at=i;save();const el=document.createElement('section');el.className='scr'+(d<0?' bl':'');stage.replaceChildren(el);stage.scrollTop=0;SC[i].r(el);refresh();requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')))}
$('#next').addEventListener('click',()=>{const ts=SC[st.at].tasks();if(!ts.every(t=>t[1])){const nx=$('#next');nx.classList.remove('shake');void nx.offsetWidth;nx.classList.add('shake');stage.classList.add('nudge');setTimeout(()=>stage.classList.remove('nudge'),1800);const t=ts.find(t=>!t[1]);toast(`First: ${t[0].toLowerCase()}. Tap the glowing items.`);return}st.max=Math.max(st.max,st.at+1);go(st.at+1,1)});
$('#back').addEventListener('click',()=>go(st.at-1,-1));
$('#bar').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b&&!b.disabled){const i=+b.dataset.g;if(i!==st.at)go(i,i<st.at?-1:1)}});

const T0=Date.parse('2026-11-26T08:00:00-05:00'),T1=Date.parse('2026-11-26T17:15:00-05:00');
function cd(){const c=$('#cd');if(!c)return;const d=T0-Date.now(),l=$('#cdl');
 if(d>0){const v=[[Math.floor(d/864e5),'days'],[Math.floor(d/36e5)%24,'hrs'],[Math.floor(d/6e4)%60,'min'],[Math.floor(d/1e3)%60,'sec']];l.textContent='Wheels up in';c.innerHTML=v.map(x=>`<div><b>${String(x[0]).padStart(2,'0')}</b><span>${x[1]}</span></div>`).join('')}
 else if(Date.now()<T1){l.textContent='The trip is live';c.innerHTML='<div class="live"><b>Trip day</b><span>Enjoy every stop</span></div>'}
 else{l.textContent='Trip complete';c.innerHTML='<div class="live"><b>Done</b><span>See you next year</span></div>'}}
setInterval(cd,1000);

document.body.classList.toggle('rainy',st.rain===true);
go(st.at,1);
}
</script>
</body>
</html>
