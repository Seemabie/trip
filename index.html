<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanksgrilling at High Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE playful trip game, relaxed and effortless, polished like a shipped app
   IDEA a road trip played chapter by chapter, one big glowing button per screen, the rest plays itself
   PICTURE every chapter is one live illustrated scene: map tour, plate, mountain drive, fog, camp, steak, cliff road, three states
   COLOUR deep spruce world, fog paper cards, ember orange for the one thing to tap, river blue for rain, green for done
   TYPE Overpass 900 titles and times (highway sign lettering) + Overpass text
   LAYOUT one screen app: header with chapter and progress bar, task chip, stage, big Next button that lights up when the chapter is done */
:root{color-scheme:dark;--bg:#12342a;--deep:#0c261e;--panel:#0f2c23;--edge:#2c5a4b;--ink:#eef5ef;--mute:#a9c4b8;--ember:#ff6a3d;--eink:#2a0f05;--river:#7fb7c9;--paper:#f5f7f2;--pink:#12271f;--pmute:#4f6158;--ok:#2f8f67}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#1d4a3c 0%,#12342a 55%,#0b2119 100%);color:var(--ink);font:16px/1.5 Overpass,system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-weight:900;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;max-width:1100px;margin:0 auto;padding:0 max(16px,3vw)}
.hd{display:flex;align-items:center;gap:12px;padding:14px 0 8px}
.hd .tt{flex:1}
#kick{font-size:13px;color:var(--mute)}
#ttl{display:block;font-size:20px;font-weight:900;line-height:1.15}
.brand{font-weight:900;color:var(--ember)}
.ib0{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:var(--panel);font-size:24px;line-height:1;flex:none}
.ib0:disabled{opacity:.35;cursor:default}
.bar{display:grid;gap:4px}
.bar button{height:18px;border:0;background:none;padding:0;position:relative}
.bar button::before{content:"";position:absolute;left:0;right:0;top:6px;height:6px;border-radius:9px;background:#2a5446}
.bar button.dn::before{background:var(--ember)}
.bar button.cur::before{background:#fff}
.bar button:disabled{cursor:default}
.tasks{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 2px}
.tasks .tl{font-size:13px;color:var(--mute);margin-right:2px}
.task{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);font-size:14px;font-weight:800}
.task i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ember);display:grid;place-items:center;flex:none}
.task.ok{color:var(--mute)}
.task.ok i{background:var(--ok);border-color:var(--ok)}
.task em{font-style:normal;color:var(--ember);font-variant-numeric:tabular-nums}
.stage{overflow-y:auto;overflow-x:hidden;padding:12px 2px 18px;position:relative}
.ft{padding:8px 0 max(14px,env(safe-area-inset-bottom))}
.next{width:100%;min-height:58px;border-radius:16px;border:0;background:#24493d;color:var(--mute);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.next.ready{background:var(--ember);color:var(--eink);animation:rdy 1.6s ease-in-out infinite}
.next.shake{animation:shk .4s}
@keyframes rdy{50%{box-shadow:0 0 0 8px rgba(255,106,61,.28)}}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.todo{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,106,61,.7)}60%{box-shadow:0 0 0 10px rgba(255,106,61,0)}}
.nudge .todo{animation-duration:.55s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pr 1.6s ease-out infinite;pointer-events:none}
@keyframes pr{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
.scr{opacity:0;transform:translateX(28px);transition:opacity .35s,transform .35s}
.scr.bl{transform:translateX(-28px)}
.scr.on{opacity:1;transform:none}
.lead h1{font-size:clamp(32px,5vw,48px)}
.lead h2{font-size:clamp(26px,4vw,36px)}
.lead p{color:var(--mute);margin-top:8px;max-width:62ch;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;background:var(--ember);color:var(--eink);font-weight:900;font-size:17px;border:0;text-decoration:none}
.btn.gh{background:transparent;color:var(--ink);border:1.5px solid var(--edge);min-height:44px;font-size:15px}
.btn.done{background:var(--ok);color:#fff}
.lnk{display:inline-block;margin-top:12px;color:var(--ember);font-weight:800}
.note{color:var(--mute);margin-top:12px;font-size:15px}
.pp{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:16px}
.pp h3{font-size:20px;margin-bottom:8px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;background:var(--paper);color:var(--pink);padding:12px 18px;border-radius:14px;font-weight:800;width:max-content;max-width:min(92vw,480px);text-align:center;transition:.25s;pointer-events:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.sbox{position:relative;border-radius:20px;overflow:hidden;background:#cfe0da;margin-top:14px}
.sbox>svg{display:block;width:100%;height:auto}
svg text{font-family:Overpass,system-ui,sans-serif;font-weight:800}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 160px;margin-top:20px;background:var(--paper);color:var(--pink);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.3);transition:transform .35s}
.ticket.punched{transform:rotate(-1.5deg)}
.tk-main{padding:22px}
.tk-k{font-size:14px;font-weight:800;color:#c2410c}
.tk-t{display:block;font-size:clamp(22px,3vw,30px);font-weight:900;line-height:1.1;margin-top:4px}
.tk-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.tk-g span{display:block;font-size:13px;color:var(--pmute)}
.tk-g b{font-size:17px;white-space:nowrap}
.tk-by{display:block;margin-top:16px;font-size:13px;color:var(--pmute)}
.tk-stub{border:0;border-left:3px dashed #c9d3cb;background:#ffe6dc;color:var(--pink);display:grid;place-items:center;align-content:center;gap:10px;padding:16px;font-weight:900;font-size:16px}
.tk-stub.todo{animation:none}
.tk-stub.todo .hole{animation:hp 1.2s ease-in-out infinite}
@keyframes hp{50%{transform:scale(1.18)}}
.hole{width:38px;height:38px;border-radius:50%;border:3px dashed #c2410c}
.punched .tk-stub{background:var(--ember)}
.punched .hole{background:#12342a;border:0;box-shadow:inset 0 3px 5px rgba(0,0,0,.5)}
.cdw{margin-top:22px}
.cdw>span{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
.count{display:flex;gap:8px;flex-wrap:wrap}
.count div{background:var(--deep);border:1px solid var(--edge);border-radius:14px;padding:9px 10px 6px;min-width:66px;text-align:center}
.count b{display:block;font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--mute)}
.count .live{text-align:left;padding:9px 16px 6px}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row2 input{flex:1 1 240px;min-height:52px;border-radius:12px;border:1.5px solid var(--edge);background:var(--deep);padding:0 14px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-top:16px}
.fc{position:relative;height:150px;border:0;background:none;padding:0;perspective:900px;border-radius:18px}
.fc .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.fc.fl .in{transform:rotateY(180deg)}
.fc .f,.fc .bk{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;align-content:center;justify-items:center;gap:4px;padding:14px;text-align:center}
.fc .f{background:var(--panel);border:1.5px solid var(--edge)}
.fc .f b{font-size:46px;font-weight:900;color:var(--ember);line-height:1}
.fc .f span{font-weight:800}
.fc .bk{background:var(--paper);color:var(--pink);transform:rotateY(180deg)}
.fc .bk em{font-style:normal;font-weight:900;color:#c2410c;font-size:19px;line-height:1.1}
.fc .bk small{font-size:13px;color:var(--pmute);line-height:1.3}
.vinyl svg{display:block;width:min(100%,320px);height:auto;margin:0 auto;filter:drop-shadow(0 16px 24px rgba(0,0,0,.35))}
.vinyl.spin svg{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fig{position:relative;height:clamp(220px,40vh,420px);border-radius:20px;overflow:hidden;background:#cfe0da;--sky1:#9cb7ae;--sky2:#e3ece6}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rainy .fig{--sky1:#6e8580;--sky2:#aebdb7}
.lab{font-size:14px;fill:#10261f;paint-order:stroke;stroke:#eef3ee;stroke-width:4px;stroke-linejoin:round}
.narrow .pin:not(.sel) .lab{display:none}
.pin{cursor:pointer;outline:none}
.pin .pi{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.pin .b{fill:#fff;stroke:#163b30;stroke-width:3}
.pin .n{fill:#163b30;font-size:14px;font-weight:900}
.pin.done .b{fill:#2f8f67;stroke:#fff}
.pin.done .n{fill:#fff}
.pin.sel .b{fill:var(--ember);stroke:#fff}
.pin.sel .n{fill:var(--eink)}
.pin.sel .pi,.pin:focus-visible .pi{transform:scale(1.28)}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-weight:800}
.tbar .meter{flex:1 1 160px}
.info{margin-top:10px}
.info .ct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.no{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ember);color:var(--eink);font-weight:900;flex:none}
.tm{font-size:28px;font-weight:900;line-height:1;white-space:nowrap}
.tm small{font-size:14px;margin-left:3px}
.info h3{font-size:24px;margin-top:10px}
.info .pl{color:var(--mute)}
.info p.bd{margin-top:8px}
.roads{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--mute)}
.sh{width:34px;height:34px;flex:none}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.mi{min-height:66px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--edge);background:var(--panel)}
.mi b{display:block;font-size:16px}
.mi span{font-size:13px;color:var(--mute)}
.mi[aria-pressed=true]{background:var(--paper);color:var(--pink);border-color:var(--paper)}
.mi[aria-pressed=true] span{color:var(--pmute)}
.plate svg{display:block;width:min(100%,380px);height:auto;margin:0 auto;filter:drop-shadow(0 16px 24px rgba(0,0,0,.3))}
.shrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.shb{min-height:84px;border-radius:16px;border:1.5px solid var(--edge);background:var(--panel);display:grid;justify-items:center;align-content:center;gap:4px;padding:10px;transition:background .3s,border-color .3s}
.shb svg{width:42px;height:42px}
.shb span{font-size:13px;color:var(--mute);font-weight:700}
.shb.ok{border-color:var(--ok);background:#173f31}
.shb.on{border-color:var(--ember)}
.meter{height:10px;border-radius:99px;background:var(--edge);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ember);border-radius:99px;transition:width .5s}
.mt{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 6px;color:var(--mute)}
.big{margin-top:14px;font-size:clamp(20px,3vw,26px);font-weight:900;color:var(--ember)}
.ovl{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--pink);font-weight:900;padding:8px 18px;border-radius:99px;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}
.ovl em{font-style:normal;color:#c2410c;margin-left:6px}
.puff{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .6s,transform .8s;animation:bob 3.2s ease-in-out infinite}
.puff.gone{opacity:0;pointer-events:none;animation:none}
.puff.gone.l{transform:translateX(-160px) scale(.7)}
.puff.gone.r{transform:translateX(160px) scale(.7)}
@keyframes bob{50%{transform:translateY(-6px)}}
.hand{transform-box:fill-box;transform-origin:center;animation:tap 1.1s ease-in-out infinite;pointer-events:none}
@keyframes tap{50%{transform:translate(-5px,-9px) scale(.9)}}
.fc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.day{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:12px;text-align:center}
.day.hl{border:2px solid var(--ember)}
.day svg{width:56px;height:56px}
.day b{display:block;font-size:22px;font-weight:900;white-space:nowrap}
.day span{display:block;color:var(--mute);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.choice{padding:16px;border-radius:18px;border:1.5px solid var(--edge);background:var(--panel);text-align:left;min-height:96px}
.choice b{display:block;font-size:19px;line-height:1.2}
.choice span{display:block;color:var(--mute);font-size:15px;margin-top:6px}
.choice[aria-pressed=true]{background:var(--paper);color:var(--pink);border-color:var(--paper)}
.choice[aria-pressed=true] span{color:var(--pmute)}
.stat{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--edge);background:var(--panel);font-weight:800;font-size:15px;color:var(--mute);transition:.3s}
.stat span.on{background:var(--ok);border-color:var(--ok);color:#fff}
.steak svg{display:block;width:min(100%,360px);height:auto;margin:0 auto}
.steak .meat{transition:fill .5s}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.camrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:14px}
.pol{background:#fff;color:#111;padding:10px 10px 12px;border-radius:6px;transform:rotate(-3deg);width:min(240px,70%);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.pol svg{display:block;width:100%;height:auto}
.pol p{font-weight:900;margin-top:8px;text-align:center;font-size:15px}
.veil{transition:opacity .9s}
.up .veil{opacity:0}
.reg{stroke:#fff;stroke-width:3;transition:fill .4s}
.reg.v{fill:#ffb79f}
.walker{transition:transform .7s}
.bring{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.bring div{background:var(--paper);color:var(--pink);border-radius:20px;padding:18px 14px;text-align:center;display:grid;justify-items:center;gap:6px}
.bring svg{width:64px;height:64px}
.bring b{font-size:19px;line-height:1.15}
.bring span{font-size:14px;color:var(--pmute)}
.handled{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.handled li{display:flex;align-items:center;gap:10px;font-weight:700}
.handled i{width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.qcard{background:var(--paper);color:var(--pink);border-radius:22px;padding:22px;max-width:680px;margin-top:14px}
.qcard h3{font-size:clamp(22px,3vw,28px)}
.qdots{display:flex;gap:6px;margin-bottom:10px}
.qd{width:40px;height:24px;border:0;background:none;padding:0;position:relative}
.qd::before{content:"";position:absolute;left:0;right:0;top:9px;height:6px;border-radius:9px;background:#cdd7cf}
.qd.d::before{background:var(--ok)}
.qd.c::before{background:var(--ember)}
.qn{font-size:14px;color:var(--pmute);font-weight:800;margin-bottom:6px}
.qnav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:16px}
.qb{min-height:50px;padding:0 20px;border-radius:99px;border:1.5px solid #c9d3cb;background:#fff;color:var(--pink);font-weight:900;font-size:16px}
.qb.pri{background:var(--ember);border-color:var(--ember);color:var(--eink)}
.qb:disabled{opacity:.4;cursor:default}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{min-height:56px;text-align:left;padding:0 16px;border-radius:14px;border:2px solid #d3dcd4;background:#fff;color:var(--pink);font-weight:800;font-size:17px}
.opt.todo{animation:glow 1.6s ease-in-out infinite}
.opt.right{background:#d8f1e4;border-color:#2f8f67}
.opt.wrong{background:#ffe1d6;border-color:#c2410c}
.expl{margin-top:12px;color:#33463d}
.qcard .btn{margin-top:14px}
.endg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--edge)}
.mini li:last-child{border-bottom:0}
.mini b{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini small{font-size:12px;margin-left:2px}
.picks{display:grid;gap:8px;margin:0 0 14px}
.picks div{display:grid;grid-template-columns:7em minmax(0,1fr);gap:10px}
.picks dt{color:var(--mute);font-size:14px}
.picks dd{margin:0;font-weight:800}
.legs{display:grid;gap:8px}
.leg{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px;padding:8px 14px;border-radius:12px;background:var(--deep);text-decoration:none;border:1px solid var(--edge);color:var(--ink)}
.leg b{display:block}
.leg span{font-size:13px;color:var(--mute)}
.leg em{font-style:normal;color:var(--ember);font-weight:900;flex:none}
.cf{position:fixed;top:-16px;width:9px;height:15px;border-radius:2px;z-index:8;pointer-events:none;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@media(max-width:760px){.split,.two,.endg{grid-template-columns:minmax(0,1fr)}.choices{grid-template-columns:minmax(0,1fr)}.plate svg{width:min(70%,260px)}.vinyl svg{width:min(55%,220px)}.steak svg{width:min(75%,260px)}.split{gap:14px}}
@media(max-width:600px){.ticket{grid-template-columns:minmax(0,1fr)}.tk-stub{border-left:0;border-top:3px dashed #c9d3cb;grid-auto-flow:column;min-height:76px}.tk-g{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{display:none}.count b{font-size:24px}.count div{min-width:58px}.fc3 .day svg{width:44px;height:44px}.bring{grid-template-columns:minmax(0,1fr)}.bring div{grid-template-columns:auto minmax(0,1fr);text-align:left;justify-items:start;align-items:center;column-gap:14px}.bring div svg{grid-row:span 2;width:52px;height:52px}.handled{grid-template-columns:minmax(0,1fr)}.ovl{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <header class="hd"><button class="ib0" id="back" aria-label="Previous chapter">‹</button><div class="tt"><span id="kick"></span><b id="ttl"></b></div><span class="brand">Thanksgrilling</span></header>
 <nav class="bar" id="bar" aria-label="Chapters"></nav>
 <div class="tasks" id="tasks" aria-live="polite"></div>
 <main class="stage" id="stage"></main>
 <footer class="ft"><button class="next" id="next"></button></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
{

const hawkBase=()=>`<defs>${sky('hsky','#a7c0bd','#e8efea')}</defs><rect width="600" height="340" fill="url(#hsky)"/><path d="M0 200 C100 170 200 190 300 160 C380 140 460 120 600 110 L600 340 L0 340Z" fill="#b5c9c0"/><path d="M600 0 L600 340 L300 340 C330 300 300 260 330 220 C360 180 330 130 380 80 C410 50 450 20 480 0Z" fill="#6d5e52"/><path d="M370 100 C420 110 480 96 600 104M350 170 C420 180 500 166 600 176M330 240 C420 250 500 236 600 246" stroke="#5c4f45" stroke-width="3" fill="none"/>${[...Array(9)].map((_,i)=>`<polygon points="${470+i*15},${8+i*3} ${478+i*15},${-14+i*3} ${486+i*15},${8+i*3}" fill="#2f5f50"/>`).join('')}<path d="M0 250 C100 254 200 270 330 266 L330 300 C250 312 100 292 0 300Z" fill="#4f7f6f"/><path d="M0 302 C150 290 250 326 380 304 L380 340 L0 340Z" fill="#8cc0cf"/><path d="M40 318 C120 312 200 330 300 318" stroke="#d9eef3" stroke-width="2" fill="none"/><path d="${HROAD}" fill="none" stroke="#163b30" stroke-width="12" stroke-linecap="round"/><path class="hr" d="${HROAD}" fill="none" stroke="#ff6a3d" stroke-width="5" stroke-linecap="round"/><path d="${HROAD}" fill="none" stroke="#fff4ec" stroke-width="1.5" stroke-dasharray="6 9"/>`;
function rHawk(el){
 el.innerHTML=`<div class="lead"><h2>Hawk's Nest</h2><p>Route 97, cut into the cliff above the Delaware. Tap the button, ride the S curves, and the camera snaps the shot for you.</p></div><div class="sbox"><svg viewBox="0 0 600 340" role="img" aria-label="Cliff road above the river">${hawkBase()}<g id="hcar">${CAR}</g></svg><div class="flash" id="fl"></div></div><div class="camrow"><button class="btn${st.hawk?' gh':' todo'}" id="hgo">${st.hawk?'Ride it again':"Drive Hawk's Nest"}</button><div id="pol"></div></div>`;
 const mv=mover($('.hr',el),$('#hcar',el),{flip:true,scale:.8});let busy=false;
 const pol=()=>{$('#pol',el).innerHTML=st.hawk?`<div class="pol"><svg viewBox="0 0 600 340" aria-hidden="true">${hawkBase()}</svg><p>Hawk's Nest, Route 97</p></div>`:''};
 mv.at(st.hawk?mv.L:0);pol();
 $('#hgo',el).addEventListener('click',()=>{if(busy)return;busy=true;const b=$('#hgo',el);b.classList.remove('todo');b.textContent='Driving';mv.at(0);mv.anim(mv.L,3600,()=>{const f=$('#fl',el);f.classList.remove('go');void f.offsetWidth;f.classList.add('go');busy=false;b.textContent='Ride it again';b.classList.add('gh');const first=!st.hawk;st.hawk=true;save();pol();if(first)done('Photo snapped. Tap Next.')})});
}

/* 12 port jervis */
function rPJ(el){
 const RG={pa:['Pennsylvania','M0 0 L60 0 C150 60 200 110 210 130 C220 160 150 210 120 260 L0 260Z',70,150,'#c7d8cf'],ny:['New York','M60 0 L400 0 L400 190 L210 130 C200 110 150 60 60 0Z',300,62,'#b3cbbf'],nj:['New Jersey','M210 130 L400 190 L400 260 L120 260 C150 210 220 160 210 130Z',300,228,'#d9e4dd']};
 const houses=[...Array(12)].map((_,i)=>{const x=40+i*28,y=168+(i%3)*6;return `<rect x="${x}" y="${y}" width="18" height="14" fill="${i%2?'#e9e1d2':'#d7cbb6'}"/><polygon points="${x-2},${y} ${x+9},${y-8} ${x+20},${y}" fill="#8b4a36"/>`}).join('');
 el.innerHTML=`<div class="lead"><h2>Port Jervis</h2><p>Two quick stops before sunset. One tap each.</p></div><div class="two"><div class="pp${st.peter?' up':''}" id="pk"><h3>Point Peter overlook</h3><div class="sbox" style="margin-top:6px"><svg viewBox="0 0 400 210" role="img" aria-label="View over Port Jervis"><defs>${sky('psky','#a9c3d0','#f0f4f1')}</defs><rect width="400" height="210" fill="url(#psky)"/><path d="M0 110 C80 80 160 96 240 74 C300 58 350 70 400 64 L400 210 L0 210Z" fill="#9db8ad"/><polygon points="338,66 344,66 342,44 341,40 340,44" fill="#eef3ef"/><path d="M0 150 C100 130 200 160 400 128 L400 146 C220 176 100 150 0 168Z" fill="#8cc0cf"/>${houses}<path d="M0 210 L0 196 C100 186 260 192 400 182 L400 210Z" fill="#2f5f50"/><rect class="veil" width="400" height="210" fill="#e9efeb"/><text class="veil" x="200" y="112" text-anchor="middle" font-size="20" fill="#4f6158">The view is up the hill</text></svg></div><p class="note" id="pnote">${st.peter?'Port Jervis below, the Delaware winding through, and High Point Monument on the far ridge.':'Skyline Drive winds up to the lookout.'}</p><div class="cta"><button class="btn${st.peter?' done':' todo'}" id="drive">${st.peter?'View unlocked':'Drive up Skyline Drive'}</button></div></div><div class="pp"><h3>Tri States Monument</h3><div class="sbox" style="margin-top:6px"><svg viewBox="0 0 400 260" role="img" aria-label="Where three states meet">${Object.entries(RG).map(([k,r])=>`<path class="reg${st.walk?' v':''}" id="r-${k}" d="${r[1]}" fill="${r[4]}"/>`).join('')}<path d="M60 0 C150 60 200 110 210 130 C220 160 150 210 120 260" fill="none" stroke="#7fb7c9" stroke-width="9"/><path d="M330 0 C290 60 240 100 210 130" fill="none" stroke="#7fb7c9" stroke-width="6"/>${Object.values(RG).map(r=>`<text x="${r[2]}" y="${r[3]}" text-anchor="middle" font-size="17" fill="#12271f">${r[0]}</text>`).join('')}<rect x="204" y="124" width="12" height="12" fill="#12271f"/><g class="walker" id="wk" transform="translate(210 160)"><circle cx="0" cy="-22" r="7" fill="#ff6a3d" stroke="#fff" stroke-width="2"/><path d="M-8 4 L0 -14 L8 4Z" fill="#ff6a3d" stroke="#fff" stroke-width="2"/></g></svg></div><p class="note" id="tnote">${st.walk?'You stood in three states at once.':'Where the Neversink meets the Delaware.'}</p><div class="cta"><button class="btn${st.walk?' done':' todo'}" id="walk">${st.walk?'Three states done':'Walk all three states'}</button></div></div></div>`;
 let busy=false;
 const chk=m=>{refresh();if(st.peter&&st.walk)toast('Both stops done. Tap Next.');else toast(m)};
 $('#drive',el).addEventListener('click',()=>{if(st.peter)return;st.peter=true;save();$('#pk',el).classList.add('up');const b=$('#drive',el);b.classList.remove('todo');b.classList.add('done');b.textContent='View unlocked';$('#pnote',el).textContent='Port Jervis below, the Delaware winding through, and High Point Monument on the far ridge.';chk('View unlocked. Now the three states.')});
 $('#walk',el).addEventListener('click',()=>{if(busy||st.walk)return;busy=true;const b=$('#walk',el);b.classList.remove('todo');b.textContent='Walking';['pa','ny','nj'].forEach((k,i)=>later(()=>{$('#r-'+k,el).classList.add('v');$('#wk',el).setAttribute('transform',`translate(${RG[k][2]} ${RG[k][3]+34})`);$('#tnote',el).textContent=`Now standing in ${RG[k][0]}.`;if(i===2)later(()=>{busy=false;st.walk=true;save();b.classList.add('done');b.textContent='Three states done';$('#tnote',el).textContent='You stood in three states at once.';chk('Three states at once. Now Point Peter.')},700)},300+i*900))});
}

/* 13 bring */
function rBring(el){
 const IC={chai:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 26h30v14a14 14 0 0 1-14 14h-2A14 14 0 0 1 14 40z" fill="#c98a4b"/><path d="M44 30h4a6 6 0 0 1 0 12h-4" fill="none" stroke="#c98a4b" stroke-width="4"/><path d="M24 20c-3-5 3-7 0-12M32 20c-3-5 3-7 0-12" stroke="#ff6a3d" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="18" y="29" width="22" height="5" rx="2.5" fill="#e3b27a"/></svg>',coat:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 10l10 6 10-6 12 8 4 16-8 2v20H14V36l-8-2 4-16z" fill="#2f6fb0"/><path d="M32 16v40" stroke="#f5f7f2" stroke-width="3"/><path d="M26 10l6 10 6-10" fill="none" stroke="#ff6a3d" stroke-width="3"/></svg>',smile:'<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="24" fill="#ffc35a"/><circle cx="24" cy="27" r="3.5" fill="#12342a"/><circle cx="40" cy="27" r="3.5" fill="#12342a"/><path d="M21 37c6 8 16 8 22 0" stroke="#12342a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>'};
 el.innerHTML=`<div class="lead"><h2>All you bring is this</h2><p>Relax. ${ME} and ${CO} have everything else handled.</p></div><div class="bring"><div>${IC.chai}<b>Chai</b><span>A thermos of the good stuff</span></div><div>${IC.coat}<b>Warm clothes</b><span>It is chilly and breezy up top</span></div><div>${IC.smile}<b>Fun and a smile</b><span>The most important item</span></div></div><div class="pp" style="margin-top:14px"><h3>Handled by ${ME} and ${CO}</h3><ul class="handled">${['The rib eyes and the steak BBQ','The grill and all the cooking gear','The route and the timing','The rain backup plan'].map(t=>`<li><i>${CHK}</i>${t}</li>`).join('')}</ul></div><div class="cta"><button class="btn${st.bring?' done':' todo'}" id="in">${st.bring?'You are in':'Count me in'}</button></div>`;
 $('#in',el).addEventListener('click',()=>{if(st.bring)return;st.bring=true;save();const b=$('#in',el);b.classList.remove('todo');b.classList.add('done');b.textContent='You are in';done('See you there. Tap Next.')});
}

/* 14 trivia */
function rQuiz(el){
 el.innerHTML=`<div class="lead"><h2>Quick road trivia</h2><p>Just for fun. Answer, skip, or tap Next at the bottom whenever you like.</p></div><div class="qcard" id="qc"></div>`;
 const n=QZ.length;let tmr=0;cleanup.push(()=>clearTimeout(tmr));
 const paint=()=>{const ans=st.quiz,dots=`<div class="qdots">${QZ.map((_,i)=>`<button class="qd${i===st.qi?' c':ans[i]!==undefined?' d':''}" data-j="${i}" aria-label="Question ${i+1}"></button>`).join('')}</div>`;
  if(st.qi>=n){const got=Object.keys(ans).length,sc=QZ.filter((q,i)=>ans[i]===q[2]).length;$('#qc',el).innerHTML=`${dots}<h3>${got?`You got ${sc} of ${got}`:'All skipped, no problem'}</h3><p class="expl">${!got?'You will see it all in person on Thursday.':sc===n?`Perfect run. ${ME} is impressed.`:'Nice. You are ready for the tour.'}</p><div class="qnav"><button class="qb" data-a="again">Play again</button><button class="qb pri" data-a="end">Go to the finale ›</button></div>`;return}
  const q=QZ[st.qi],a=ans[st.qi];
  $('#qc',el).innerHTML=`${dots}<p class="qn">Question ${st.qi+1} of ${n}</p><h3>${q[0]}</h3><div class="opts">${q[1].map((o,k)=>`<button class="opt${a===undefined?'':k===q[2]?' right':k===a?' wrong':''}" data-k="${k}"${a!==undefined?' disabled':''}>${o}</button>`).join('')}</div>${a!==undefined?`<p class="expl"><b>${a===q[2]?'Correct.':'Close.'}</b> ${q[3]}</p>`:''}<div class="qnav"><button class="qb" data-a="prev"${st.qi===0?' disabled':''}>‹ Back</button><button class="qb pri" data-a="skip">${a!==undefined?(st.qi===n-1?'See score ›':'Next question ›'):'Skip ›'}</button></div>`};
 const goq=i=>{clearTimeout(tmr);st.qi=Math.max(0,Math.min(n,i));save();paint()};
 paint();
 $('#qc',el).addEventListener('click',e=>{const o=e.target.closest('.opt');if(o){if(st.quiz[st.qi]!==undefined)return;st.quiz[st.qi]=+o.dataset.k;save();paint();const at=st.qi;clearTimeout(tmr);tmr=setTimeout(()=>{if(st.qi===at)goq(at+1)},1400);return}
  const d=e.target.closest('.qd');if(d){goq(+d.dataset.j);return}
  const b=e.target.closest('.qb');if(!b)return;const a=b.dataset.a;if(a==='prev')goq(st.qi-1);else if(a==='skip')goq(st.qi+1);else if(a==='again'){st.quiz={};goq(0)}else if(a==='end'){st.max=Math.max(st.max,st.at+1);go(st.at+1,1)}});
}

/* 15 finale */
function rEnd(el){
 const crew=(st.crew||[]).map(([n,r])=>`${esc(n)}: ${roleOf(r)[0]}`).join(', ')||'Not dealt';
 const food=st.order.map(k=>MENU.find(m=>m[0]===k)[1]).join(', ')||'Chef picks';
 el.innerHTML=`<div class="lead"><h1>Road ready</h1><p>That is the whole trip. ${ME} will see you outside Dera at 8 sharp. Bring chai, warm clothes and a smile.</p></div><div class="cdw"><span id="cdl">Wheels up in</span><div class="count" id="cd"></div></div><div class="endg"><div class="pp"><h3>The day</h3><ol class="mini">${S.map((_,i)=>{const v=view(i);return `<li><b>${v.time}<small>${v.ap}</small></b><span>${v.name}</span></li>`}).join('')}</ol></div><div class="pp"><h3>Your picks</h3><dl class="picks"><div><dt>BBQ call</dt><dd>${st.rain?'Chai at the lake, steaks at home':'Steak BBQ at the lake'}</dd></div><div><dt>Breakfast</dt><dd>${food}</dd></div><div><dt>Rib eye</dt><dd>${st.gd!==null?DON[st.gd][0]:'Chef picks'}</dd></div><div><dt>Crew</dt><dd>${crew}</dd></div></dl><h3>Navigate</h3><div class="legs">${LEGS.map(l=>`<a class="leg" href="${l[2]}" target="_blank" rel="noopener"><span><b>${l[0]}</b><span>${l[1]}</span></span><em>Go ›</em></a>`).join('')}<a class="leg" href="${esc(PL)}" target="_blank" rel="noopener"><span><b>Road trip playlist</b><span>YouTube Music</span></span><em>Play ›</em></a></div></div></div><div class="cta"><button class="btn gh" id="replay">Replay from the start</button></div>`;
 cd();
 if(!reduce){const cols=['#ff6a3d','#7fb7c9','#f5f7f2','#2f8f67','#ffc35a'];const r=rng(Date.now()%9999+1);const bits=[];for(let i=0;i<46;i++){const c=document.createElement('i');c.className='cf';c.style.left=(r()*100)+'vw';c.style.background=cols[i%5];c.style.animationDelay=(r()*.8)+'s';document.body.appendChild(c);bits.push(c)}later(()=>bits.forEach(b=>b.remove()),4000);cleanup.push(()=>bits.forEach(b=>b.remove()))}
 $('#replay',el).addEventListener('click',()=>{const names=st.names;st=Object.assign({},DEF,{names,order:[],fog:[],quiz:{}});save();document.body.classList.remove('rainy');go(0,-1)});
}

const tap=sel=>{const e=stage.querySelector(sel);if(e)e.dispatchEvent(new MouseEvent('click',{bubbles:true}))};
const SC=[
 {t:'Your ticket',tasks:()=>[['Punch your ticket',st.punched]],r:rTicket,auto:()=>tap('#punch')},
 {t:'Meet the crew',tasks:()=>[['Deal the roles',!!st.crew]],r:rCrew,auto:()=>tap('#spin')},
 {t:'Road trip playlist',tasks:()=>[['Join the playlist',st.pl]],r:rPlay,auto:()=>{st.pl=true;save();go(st.at,1)}},
 {t:'The route',tasks:()=>[['Watch the route tour',st.tour]],r:rMap,auto:()=>{st.tour=true;save();go(st.at,1)}},
 {t:'Dosa House',tasks:()=>[['Pick a dish',st.order.length>0]],r:rDosa,auto:()=>tap('.mi[data-k="masala"]')},
 {t:'The climb',tasks:()=>[['Start the climb',st.climb===3]],r:rClimb,auto:()=>{st.climb=3;save();go(st.at,1)}},
 {t:'The summit',tasks:()=>[['Tap the clouds',st.fog.length===4,`${st.fog.length}/4`]],r:rSummit,auto:()=>$$('.puff:not(.gone)',stage).forEach(g=>g.dispatchEvent(new MouseEvent('click',{bubbles:true})))},
 {t:'The weather call',tasks:()=>[['Pick a plan',st.rain!==null]],r:rWx,auto:()=>tap('.choice[data-i="0"]')},
 {t:'Lake Marcia camp',tasks:()=>[['Set up camp',st.camp]],r:rSetup,auto:()=>{st.camp=true;save();go(st.at,1)}},
 {t:'Rib eye order',tasks:()=>[['Pick how you like it',st.gd!==null]],r:rGrill,auto:()=>tap('[data-d="1"]')},
 {t:"Hawk's Nest",tasks:()=>[["Drive Hawk's Nest",st.hawk]],r:rHawk,auto:()=>{st.hawk=true;save();go(st.at,1)}},
 {t:'Port Jervis',tasks:()=>[['Drive up Point Peter',st.peter],['Walk the three states',st.walk]],r:rPJ,auto:()=>{st.peter=true;st.walk=true;save();go(st.at,1)}},
 {t:'What to bring',tasks:()=>[['Count me in',st.bring]],r:rBring,auto:()=>tap('#in')},
 {t:'Road trivia',tasks:()=>[['Just for fun, skip anytime',true]],r:rQuiz},
 {t:'Road ready',tasks:()=>[],r:rEnd}
];
st.max=Math.min(Math.max(0,st.max|0),SC.length-1);st.at=0;

function refresh(){const sc=SC[st.at],ts=sc.tasks(),ok=ts.every(t=>t[1]),last=st.at===SC.length-1;
 $('#kick').textContent=`Chapter ${st.at+1} of ${SC.length}`;$('#ttl').textContent=sc.t;
 $('#tasks').innerHTML=ts.length?`<span class="tl">${ok?'Done':'Your move'}</span>`+ts.map(t=>`<span class="task${t[1]?' ok':''}"><i>${t[1]?CHK:''}</i>${t[0]}${t[2]&&!t[1]?` <em>${t[2]}</em>`:''}</span>`).join(''):`<span class="task ok"><i>${CHK}</i>Every chapter complete</span>`;
 const nx=$('#next');nx.hidden=last;
 if(!last){nx.setAttribute('aria-disabled',String(!ok));nx.classList.toggle('ready',ok);nx.innerHTML=ok?`Next: ${SC[st.at+1].t} <span aria-hidden="true">›</span>`:nudged===st.at?'Tap again and we will do it for you':`${LOCK} Tap the glowing orange item`}
 $('#back').disabled=st.at===0;
 $('#bar').style.gridTemplateColumns=`repeat(${SC.length},minmax(0,1fr))`;
 $('#bar').innerHTML=SC.map((s,i)=>`<button class="${i<st.max&&i!==st.at?'dn':''}${i===st.at?' cur':''}" data-g="${i}" aria-label="Chapter ${i+1}, ${s.t}"${i>st.max?' disabled':''}></button>`).join('')}
function go(i,d){i=Math.max(0,Math.min(SC.length-1,i));timers.forEach(clearTimeout);timers=[];cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];st.at=i;save();const el=document.createElement('section');el.className='scr'+(d<0?' bl':'');stage.replaceChildren(el);stage.scrollTop=0;SC[i].r(el);refresh();requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')))}
let nudged=-1;
$('#next').addEventListener('click',()=>{const ts=SC[st.at].tasks();if(!ts.every(t=>t[1])){if(nudged===st.at&&SC[st.at].auto){nudged=-1;SC[st.at].auto();refresh();if(SC[st.at].tasks().every(t=>t[1]))toast('All set. Tap Next.');return}nudged=st.at;const nx=$('#next');nx.classList.remove('shake');void nx.offsetWidth;nx.classList.add('shake');stage.classList.add('nudge');setTimeout(()=>stage.classList.remove('nudge'),1800);nx.innerHTML='Tap again and we will do it for you';toast('Tap the glowing orange item, or tap Next again.');return}nudged=-1;st.max=Math.max(st.max,st.at+1);go(st.at+1,1)});
$('#back').addEventListener('click',()=>go(st.at-1,-1));
$('#bar').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b&&!b.disabled){const i=+b.dataset.g;if(i!==st.at)go(i,i<st.at?-1:1)}});

const T0=Date.parse('2026-11-26T08:00:00-05:00'),T1=Date.parse('2026-11-26T17:15:00-05:00');
function cd(){const c=$('#cd');if(!c)return;const d=T0-Date.now(),l=$('#cdl');
 if(d>0){const v=[[Math.floor(d/864e5),'days'],[Math.floor(d/36e5)%24,'hrs'],[Math.floor(d/6e4)%60,'min'],[Math.floor(d/1e3)%60,'sec']];l.textContent='Wheels up in';c.innerHTML=v.map(x=>`<div><b>${String(x[0]).padStart(2,'0')}</b><span>${x[1]}</span></div>`).join('')}
 else if(Date.now()<T1){l.textContent='The trip is live';c.innerHTML='<div class="live"><b>Trip day</b><span>Enjoy every stop</span></div>'}
 else{l.textContent='Trip complete';c.innerHTML='<div class="live"><b>Done</b><span>See you next year</span></div>'}}
setInterval(cd,1000);

document.body.classList.toggle('rainy',st.rain===true);
go(st.at,1);
}
</script>
</body>
</html>
